version: '3.9'
services:
  api:
    build: .
    container_name: posts-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/posts_db
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=post-events
      - NODE_ENV=development
    depends_on:
      - mongo
      - kafka
    networks:
      - app-network
    restart: unless-stopped

  consumer:
    build: .
    container_name: posts-consumer
    command: npm run consumer
    environment:
      - MONGODB_URI=mongodb://mongo:27017/posts_db
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=post-events
      - NODE_ENV=development
    depends_on:
      - mongo
      - kafka
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: posts-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: posts-kafka
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: Mk3j6hBWS9y0Kz2YJVQljg
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mongo-data:
  kafka-data:

networks:
  app-network:
    driver: bridge
